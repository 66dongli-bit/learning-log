{% extends "learning_logs/base.html" %}

{% block content %}

<h2>Topic: {{ topic }}</h2>

<p>
  <a class="btn btn-primary" href="{% url 'learning_logs:new_entry' topic.id %}">
    Add new entry
  </a>
</p>

<h4>Entries:</h4>

{% for entry in entries %}
  <div class="card mb-3">
    <div class="card-header">
      {{ entry.date_added|date:'M d, Y H:i' }}

      <a class="btn btn-sm btn-outline-secondary ms-2"
         href="{% url 'learning_logs:edit_entry' entry.id %}">
        Edit
      </a>

      <a class="btn btn-sm btn-outline-danger ms-2"
         href="{% url 'learning_logs:delete_entry' entry.id %}">
        Delete
      </a>
    </div>

    <div class="card-body">
      {{ entry.text|linebreaks }}
    </div>
  </div>
{% empty %}
  <p>No entries have been added yet.</p>
{% endfor %}

{% endblock content %}
