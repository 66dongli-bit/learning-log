{% extends "learning_logs/base.html" %}

{% block content %}

<h2>Delete entry</h2>

<p>Are you sure you want to delete this entry?</p>

<div class="card mb-3">
  <div class="card-body">
    {{ entry.text|linebreaks }}
  </div>
</div>

<form action="{% url 'learning_logs:delete_entry' entry.id %}" method="post">
  {% csrf_token %}

  <button class="btn btn-danger" name="submit">Yes, delete</button>
  <a class="btn btn-secondary" href="{% url 'learning_logs:topic' topic.id %}">
    Cancel
  </a>
</form>

{% endblock content %}
